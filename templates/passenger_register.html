{% extends "base.html" %}{% block title %}Create Account · GoTransit{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-aside passenger-aside"><span class="eyebrow">JOIN GOTRANSIT</span><h1>Make room for more journeys.</h1><p>Create your passenger account to get started.</p><div class="auth-illustration"><i data-lucide="user-round-plus"></i></div></div><form class="form-card" method="post"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><label>Full name<input name="passenger_name" required maxlength="100" placeholder="Your full name"></label><label>Phone number<input name="phone" inputmode="tel" required placeholder="Your phone number"></label><label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label><button class="btn btn-primary btn-full" type="submit">Register <i data-lucide="arrow-right"></i></button><p class="form-foot">Already registered? <a href="{{ url_for('passenger_login') }}">Login</a></p></form></section>{% endblock %}
